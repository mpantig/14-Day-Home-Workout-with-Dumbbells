<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14-Day Fitness Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #0284c7;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 8px 0;
        }

        p.subtitle {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
        }

        .progress-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .progress-bar-bg {
            background-color: var(--border-color);
            border-radius: 9999px;
            height: 14px;
            overflow: hidden;
            width: 100%;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .day-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .day-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .day-card:hover {
            border-color: var(--accent-blue);
        }

        .day-card.completed {
            border-color: var(--accent-green);
            background-color: rgba(16, 185, 129, 0.1);
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .day-card.completed .checkbox {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
        }

        .checkbox::after {
            content: "✓";
            color: white;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }

        .day-card.completed .checkbox::after {
            display: block;
        }

        .day-info {
            flex-grow: 1;
        }

        .day-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .day-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .workout-link {
            color: #38bdf8;
            text-decoration: underline;
            font-weight: 600;
        }

        .workout-link:hover {
            color: #7dd3fc;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>14-Day Fitness Tracker</h1>
            <p class="subtitle">Track your daily progress and reach your goal!</p>
        </header>

        <div class="progress-card">
            <div class="progress-header">
                <span>Progress:</span>
                <span id="progress-text">0 / 14 Days (0%)</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
        </div>

        <div class="day-list" id="day-list"></div>
    </div>

    <script>
        const programDays = [
            { 
                day: 1, 
                title: "Lower Body & Core", 
                details: 'Follow-along workout: <a href="https://www.youtube.com/watch?v=GY1JhB9BEkk" target="_blank" class="workout-link" onclick="event.stopPropagation()">30 Min Beginner Dumbbell Lower Body Routine</a>' 
            },
            { 
                day: 2, 
                title: "Upper Body Strength", 
                details: 'Follow-along workout: <a href="https://youtu.com/9DkfPSIe-Bs" target="_blank" class="workout-link" onclick="event.stopPropagation()">20 Min Upper Body Routine (Chloe Ting)</a>' 
            },
            { 
                day: 3, 
                title: "Full Body Compound", 
                details: 'Follow-along workout: <a href="https://www.youtube.com/watch?v=Fihj6SW1V3Q" target="_blank" class="workout-link" onclick="event.stopPropagation()">30 Min MadFit Full Body Strength Routine</a>' 
            },
            { 
                day: 4, 
                title: "Lower Body & Core", 
                details: 'Follow-along workout: <a href="https://www.youtube.com/watch?v=R4x9rXThlQs" target="_blank" class="workout-link" onclick="event.stopPropagation()">HASfit Lower Body & Core Strength Routine</a>' 
            },
            { 
                day: 5, 
                title: "Upper Body & Core", 
                details: 'Follow-along workout: <a href="https://youtu.com/J_LjQYjwHJY" target="_blank" class="workout-link" onclick="event.stopPropagation()">10 Min Plank Challenge & Upper Body Burner</a>' 
            },
            { 
                day: 6, 
                title: "Active Recovery & Mobility", 
                details: 'Follow-along workout: <a href="https://www.youtube.com/watch?v=XxuRSjER3Qk" target="_blank" class="workout-link" onclick="event.stopPropagation()">Tom Peto 20-Min Active Recovery Session</a>' 
            },
            { 
                day: 7, 
                title: "Rest & Refuel", 
                details: 'Recovery focus: <a href="https://www.youtube.com/watch?v=Cw-Wt4xKD2s" target="_blank" class="workout-link" onclick="event.stopPropagation()">Optional Light Stretch Routine / Refuel Focus</a>' 
            },
            { 
                day: 8, 
                title: "Lower Body & Core", 
                details: 'Follow-along workout: <a href="https://www.youtube.com/watch?v=GViX8riaHX4" target="_blank" class="workout-link" onclick="event.stopPropagation()">Caroline Girvan 30 Min Full Body Dumbbell</a>' 
            },
            { 
                day: 9, 
                title: "Upper Body Strength", 
                details: 'Follow-along workout: <a href="https://youtu.com/9DkfPSIe-Bs" target="_blank" class="workout-link" onclick="event.stopPropagation()">Upper Body - Back, Shoulders & Arms</a>' 
            },
            { 
                day: 10, 
                title: "Full Body Compound", 
                details: 'Follow-along workout: <a href="https://www.youtube.com/watch?v=AjAVhtQ2vok" target="_blank" class="workout-link" onclick="event.stopPropagation()">Juice & Toya 30 Min No Repeat Workout</a>' 
            },
            { 
                day: 11, 
                title: "Lower Body & Core", 
                details: 'Follow-along workout: <a href="https://www.youtube.com/watch?v=ECn65drDmFQ" target="_blank" class="workout-link" onclick="event.stopPropagation()">fitbymik 30 Min Total Body Dumbbell Routine</a>' 
            },
            { 
                day: 12, 
                title: "Upper Body & Core", 
                details: 'Follow-along workout: <a href="https://youtu.com/Gjr3CpBve4M" target="_blank" class="workout-link" onclick="event.stopPropagation()">10 Min Ab Workout Routine</a>' 
            },
            { 
                day: 13, 
                title: "Active Recovery & Mobility", 
                details: 'Follow-along workout: <a href="https://www.youtube.com/watch?v=XxuRSjER3Qk" target="_blank" class="workout-link" onclick="event.stopPropagation()">Mobility & Core Active Recovery Routine</a>' 
            },
            { 
                day: 14, 
                title: "Program Review & Milestone Check", 
                details: 'Finisher workout: <a href="https://www.youtube.com/watch?v=OFibSNpw2hE" target="_blank" class="workout-link" onclick="event.stopPropagation()">5 Min Full Body Burner & Final Check-In</a>' 
            }
        ];

        let state = JSON.parse(localStorage.getItem('fitness_tracker_state')) || {};

        function render() {
            const listContainer = document.getElementById('day-list');
            listContainer.innerHTML = '';
            let completedCount = 0;

            programDays.forEach(item => {
                const isCompleted = !!state[item.day];
                if (isCompleted) completedCount++;

                const card = document.createElement('div');
                card.className = `day-card ${isCompleted ? 'completed' : ''}`;
                card.onclick = () => toggleDay(item.day);

                card.innerHTML = `
                    <div class="checkbox"></div>
                    <div class="day-info">
                        <div class="day-title">Day ${item.day}: ${item.title}</div>
                        <div class="day-desc">${item.details}</div>
                    </div>
                `;
                listContainer.appendChild(card);
            });

            const percent = Math.round((completedCount / programDays.length) * 100);
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-text').innerText = `${completedCount} / ${programDays.length} Days (${percent}%)`;
        }

        function toggleDay(day) {
            state[day] = !state[day];
            localStorage.setItem('fitness_tracker_state', JSON.stringify(state));
            render();
        }

        render();
    </script>
</body>
</html>
