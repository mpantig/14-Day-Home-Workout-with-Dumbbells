<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14-Day Home Workout Plan</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #0284c7;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 8px 0;
        }

        p.subtitle {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
        }

        .progress-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .progress-bar-bg {
            background-color: var(--border-color);
            border-radius: 9999px;
            height: 14px;
            overflow: hidden;
            width: 100%;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .day-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .day-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .day-card:hover {
            border-color: var(--accent-blue);
        }

        .day-card.completed {
            border-color: var(--accent-green);
            background-color: rgba(16, 185, 129, 0.1);
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .day-card.completed .checkbox {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
        }

        .checkbox::after {
            content: "✓";
            color: white;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }

        .day-card.completed .checkbox::after {
            display: block;
        }

        .day-info {
            flex-grow: 1;
        }

        .day-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .day-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .workout-link {
            color: #38bdf8;
            text-decoration: underline;
            font-weight: 600;
        }

        .workout-link:hover {
            color: #7dd3fc;
        }

        .section-label {
            color: #cbd5e1;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>14-Day Home Workout Plan</h1>
            <p class="subtitle">Abs, Buttocks & Low-Impact Cardio Focus | Dynamic Warm-Ups & Cool-Downs</p>
        </header>

        <div class="progress-card">
            <div class="progress-header">
                <span>Progress:</span>
                <span id="progress-text">0 / 14 Days (0%)</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
        </div>

        <div class="day-list" id="day-list"></div>
    </div>

    <script>
        const warmupLink = '<a href="https://www.youtube.com/results?search_query=Dynamic+Warm-Up+5+Min+Full+Body" target="_blank" class="workout-link" onclick="event.stopPropagation()">Dynamic Warm-Up Guide (3–5 Mins)</a>';
        const cooldownLink = '<a href="https://www.youtube.com/results?search_query=Mobility+Cool-Down+5+Min+Stretch" target="_blank" class="workout-link" onclick="event.stopPropagation()">Mobility Cool-Down Guide (3–5 Mins)</a>';

        const programDays = [
            { 
                day: 1, 
                date: "Wed 08/19",
                category: "GLUTES & ABS", 
                focus: "Dumbbell Glute & Core Strength", 
                details: `
                    <span class="section-label">🔥 Warm-Up:</span> ${warmupLink}<br>
                    <span class="section-label">💪 Main Workout:</span> <a href="https://www.youtube.com/results?search_query=MadFit+30-Min+Abs+%26+Booty+Weights" target="_blank" class="workout-link" onclick="event.stopPropagation()">MadFit: 30-Min Abs & Booty (Weights)</a><br>
                    <span class="section-label">🧘 Cool-Down:</span> ${cooldownLink}
                ` 
            },
            { 
                day: 2, 
                date: "Thu 08/20",
                category: "ABS FOCUS", 
                focus: "Standing & Floor Core Sculpting", 
                details: `
                    <span class="section-label">🔥 Warm-Up:</span> ${warmupLink}<br>
                    <span class="section-label">💪 Main Workout:</span> <a href="https://www.youtube.com/results?search_query=MadFit+30-Min+Full+Body+%26+Core+Toning" target="_blank" class="workout-link" onclick="event.stopPropagation()">MadFit: 30-Min Full Body & Core Toning</a><br>
                    <span class="section-label">🧘 Cool-Down:</span> ${cooldownLink}
                ` 
            },
            { 
                day: 3, 
                date: "Fri 08/21",
                category: "BEGINNER HIIT", 
                focus: "Low-Impact Standing Cardio (No Jumping)", 
                details: `
                    <span class="section-label">🔥 Warm-Up:</span> ${warmupLink}<br>
                    <span class="section-label">💪 Main Workout:</span> <a href="https://www.youtube.com/results?search_query=MadFit+15-Min+Low+Impact+Cardio" target="_blank" class="workout-link" onclick="event.stopPropagation()">MadFit: 15-Min Low Impact Cardio</a><br>
                    <span class="section-label">🧘 Cool-Down:</span> ${cooldownLink}
                ` 
            },
            { 
                day: 4, 
                date: "Sat 08/22",
                category: "ACTIVE REST", 
                focus: "Hip Opening & Lower Body Mobility", 
                details: `
                    <span class="section-label">🔥 Warm-Up:</span> ${warmupLink}<br>
                    <span class="section-label">🧘 Active Recovery:</span> <a href="https://www.youtube.com/results?search_query=15-Min+Active+Recovery+%26+Mobility+Flow" target="_blank" class="workout-link" onclick="event.stopPropagation()">15-Min Active Recovery & Mobility Flow</a><br>
                    <span class="section-label">🧘 Cool-Down:</span> ${cooldownLink}
                ` 
            },
            { 
                day: 5, 
                date: "Sun 08/23",
                category: "FULL REST", 
                focus: "Complete Recovery & Hydration", 
                details: `
                    <span class="section-label">🧘 Rest Day:</span> No Workout (Complete Recovery & Hydration)
                ` 
            },
            { 
                day: 6, 
                date: "Mon 08/24",
                category: "GLUTES FOCUS", 
                focus: "Lower Body & Glute Building", 
                details: `
                    <span class="section-label">🔥 Warm-Up:</span> ${warmupLink}<br>
                    <span class="section-label">💪 Main Workout:</span> <a href="https://www.youtube.com/results?search_query=fitbymik+30-Min+Lower+Body+%26+Glutes" target="_blank" class="workout-link" onclick="event.stopPropagation()">fitbymik: 30-Min Lower Body & Glutes</a><br>
                    <span class="section-label">🧘 Cool-Down:</span> ${cooldownLink}
                ` 
            },
            { 
                day: 7, 
                date: "Tue 08/25",
                category: "ABS & CORE", 
                focus: "Dumbbell Core & No-Repeat Strength", 
                details: `
                    <span class="section-label">🔥 Warm-Up:</span> ${warmupLink}<br>
                    <span class="section-label">💪 Main Workout:</span> <a href="https://www.youtube.com/results?search_query=Juice+%26+Toya+30-Min+No+Repeat+Core+Strength" target="_blank" class="workout-link" onclick="event.stopPropagation()">Juice & Toya: 30-Min No Repeat Core/Strength</a><br>
                    <span class="section-label">🧘 Cool-Down:</span> ${cooldownLink}
                ` 
            },
            { 
                day: 8, 
                date: "Wed 08/26",
                category: "GLUTES & ABS", 
                focus: "Dumbbell Glute & Abs Burnout", 
                details: `
                    <span class="section-label">🔥 Warm-Up:</span> ${warmupLink}<br>
                    <span class="section-label">💪 Main Workout:</span> <a href="https://www.youtube.com/results?search_query=Caroline+Girvan+25-Min+Glutes+%26+Abs" target="_blank" class="workout-link" onclick="event.stopPropagation()">Caroline Girvan: 25-Min Glutes & Abs</a><br>
                    <span class="section-label">🧘 Cool-Down:</span> ${cooldownLink}
                ` 
            },
            { 
                day: 9, 
                date: "Thu 08/27",
                category: "GLUTES FOCUS", 
                focus: "Weighted Booty Sculpting", 
                details: `
                    <span class="section-label">🔥 Warm-Up:</span> ${warmupLink}<br>
                    <span class="section-label">💪 Main Workout:</span> <a href="https://www.youtube.com/results?search_query=Juice+%26+Toya+25-Min+Dumbbell+Glutes" target="_blank" class="workout-link" onclick="event.stopPropagation()">Juice & Toya: 25-Min Dumbbell Glutes</a><br>
                    <span class="section-label">🧘 Cool-Down:</span> ${cooldownLink}
                ` 
            },
            { 
                day: 10, 
                date: "Fri 08/28",
                category: "BEGINNER HIIT", 
                focus: "Low-Impact Walking Cardio HIIT", 
                details: `
                    <span class="section-label">🔥 Warm-Up:</span> ${warmupLink}<br>
                    <span class="section-label">💪 Main Workout:</span> <a href="https://www.youtube.com/results?search_query=Growwithjo+15-Min+Low+Impact+Walking+HIIT" target="_blank" class="workout-link" onclick="event.stopPropagation()">Growwithjo: 15-Min Low Impact Walking HIIT</a><br>
                    <span class="section-label">🧘 Cool-Down:</span> ${cooldownLink}
                ` 
            },
            { 
                day: 11, 
                date: "Sat 08/29",
                category: "ACTIVE REST", 
                focus: "Dance Cardio & Dynamic Stretch", 
                details: `
                    <span class="section-label">🔥 Warm-Up:</span> ${warmupLink}<br>
                    <span class="section-label">🧘 Active Recovery:</span> <a href="https://www.youtube.com/results?search_query=Pamela+Reif+15-Min+Light+Movement+Flow" target="_blank" class="workout-link" onclick="event.stopPropagation()">Pamela Reif: 15-Min Light Movement Flow</a><br>
                    <span class="section-label">🧘 Cool-Down:</span> ${cooldownLink}
                ` 
            },
            { 
                day: 12, 
                date: "Sun 08/30",
                category: "FULL REST", 
                focus: "Complete Recovery & Joint Decompression", 
                details: `
                    <span class="section-label">🧘 Rest Day:</span> No Workout (Complete Recovery & Joint Decompression)
                ` 
            },
            { 
                day: 13, 
                date: "Mon 08/31",
                category: "ABS & CORE", 
                focus: "Targeted Core & Lower Body Strength", 
                details: `
                    <span class="section-label">🔥 Warm-Up:</span> ${warmupLink}<br>
                    <span class="section-label">💪 Main Workout:</span> <a href="https://www.youtube.com/results?search_query=MadFit+30-Min+Targeted+Strength+%26+Abs" target="_blank" class="workout-link" onclick="event.stopPropagation()">MadFit: 30-Min Targeted Strength & Abs</a><br>
                    <span class="section-label">🧘 Cool-Down:</span> ${cooldownLink}
                ` 
            },
            { 
                day: 14, 
                date: "Tue 09/01",
                category: "GLUTES & ABS", 
                focus: "Weighted Glute & Core Challenge", 
                details: `
                    <span class="section-label">🔥 Warm-Up:</span> ${warmupLink}<br>
                    <span class="section-label">💪 Main Workout:</span> <a href="https://www.youtube.com/results?search_query=Growingannanas+25-Min+Glutes+Core" target="_blank" class="workout-link" onclick="event.stopPropagation()">Growingannanas: 25-Min Glutes + Core</a><br>
                    <span class="section-label">🧘 Cool-Down:</span> ${cooldownLink}
                ` 
            }
        ];

        let state = JSON.parse(localStorage.getItem('fitness_tracker_state')) || {};

        function render() {
            const listContainer = document.getElementById('day-list');
            listContainer.innerHTML = '';
            let completedCount = 0;

            programDays.forEach(item => {
                const isCompleted = !!state[item.day];
                if (isCompleted) completedCount++;

                const card = document.createElement('div');
                card.className = `day-card ${isCompleted ? 'completed' : ''}`;
                card.onclick = () => toggleDay(item.day);

                card.innerHTML = `
                    <div class="checkbox"></div>
                    <div class="day-info">
                        <div class="day-title">Day ${item.day} (${item.date}): ${item.category}</div>
                        <div class="day-desc" style="margin-bottom: 6px; font-style: italic; color: #cbd5e1;">Target Focus: ${item.focus}</div>
                        <div class="day-desc">${item.details}</div>
                    </div>
                `;
                listContainer.appendChild(card);
            });

            const percent = Math.round((completedCount / programDays.length) * 100);
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-text').innerText = `${completedCount} / ${programDays.length} Days (${percent}%)`;
        }

        function toggleDay(day) {
            state[day] = !state[day];
            localStorage.setItem('fitness_tracker_state', JSON.stringify(state));
            render();
        }

        render();
    </script>
</body>
</html>
